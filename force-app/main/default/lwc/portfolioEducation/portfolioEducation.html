<template>
    <div class="mt-64">
        <h2 class="font-bold text-8xl mb-32 w-full text-center">Experience</h2>

        <div class="w-[75%] mx-auto relative" lwc:ref="section">
            <div
                class="absolute left-9 top-0 w-[4px] h-full bg-dark origin-top transform dark:bg-light"
                style={lineStyle}>
            </div>

            <ul class="w-full flex flex-col items-start justify-between ml-4">
                <template for:each={education} for:item="edu">
                    <li key={edu.id}
                        data-id={edu.id}
                        class="my-8 first:mt-0 last:mb-0 w-[60%] mx-auto flex flex-col items-start justify-between">
                        <c-portfolio-li-icon reference={reference} parent-id={edu.id}></c-portfolio-li-icon>

                        <c-portfolio-education-details
                            type={edu.type}
                            time={edu.time}
                            place={edu.place}
                            info={edu.info}>
                        </c-portfolio-education-details>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</template>
