<template>
	<article class={articleClass}>
		<template lwc:if={link}>
			<c-link
				href={link}
				target="_blank"
				navigation-type="standard__webPage"
				class={imageWrapperClass}
			>
				<c-image
					src={img}
					alt={title}
					class-name="w-full h-auto"
					wrapper-height="20rem"
					priority="high"
					sizes="(max-width: 768px) 100vw,(max-width: 1200px) 50vw,50vw"
				>
				</c-image>
			</c-link>
		</template>
		<template lwc:else>
			<div class={imageWrapperClass}>
				<c-image
					src={img}
					alt={title}
					class-name="w-full h-auto"
					wrapper-height="20rem"
					priority="high"
					sizes="(max-width: 768px) 100vw,(max-width: 1200px) 50vw,50vw"
				>
				</c-image>
			</div>
		</template>

		<div class={infoDivClass} id="info">
			<span
				class="text-primary font-medium text-xl hover:underline underline-offset-2 cursor-pointer dark:text-primaryDark"
			>
				{name}
			</span>

			<span class="capitalize font-medium text-dark/75 dark:text-light/75">
				{time}
			</span>

			<h2 class={h2Class}>{title}</h2>

			<p class="my-2 font-medium">{summary}</p>

			<ul class="list-disc pl-[1.2rem]">
				<template for:each={responsibilitiesArray} for:item="resp">
					<li key={resp.key}>
						<p class="font-medium">{resp.value}</p>
					</li>
				</template>
			</ul>

			<div class={linkDivClass} lwc:if={showProjectLink} id="link-div">
				<c-link
					href={link}
					target="_blank"
					navigation-type="standard__webPage"
					lwc:if={link}
					class-name="block px-6 text-lg font-semibold underline dark:bg-light dark:text-dark "
					id="link"
				>
					<span>{linkSpanText}</span>
				</c-link>

				<c-link
					href={github}
					target="_blank"
					navigation-type="standard__webPage"
					class={githubLinkClass}
					lwc:if={github}
				>
					<c-portfolio-icons icon-name="github"></c-portfolio-icons>
				</c-link>
			</div>
		</div>
	</article>
</template>
